server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    # ---- React SPA ----
    # Backend bu serverda emas — alohida serverda joylashgan.
    # Frontend backend bilan to'g'ridan-to'g'ri (build vaqtida sozlangan
    # VITE_API_URL orqali) CORS orqali gaplashadi, shuning uchun bu yerda
    # /api/, /admin/, /static/, /media/ uchun proxy shart emas.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statik fayllarni (JS/CSS/rasmlar) uzoq muddat keshlash
    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
